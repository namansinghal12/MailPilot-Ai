services:
  - type: web
    name: mailpilot-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:5173

databases:
  - name: mailpilot-db
    databaseName: mailpilot
    user: mailpilot
    plan: basic-256mb
    region: oregon
